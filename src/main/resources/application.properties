# DataSource - MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/ffblobby
spring.datasource.username=ffblobby
spring.datasource.password=ffblobby
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Admin credentials — MUST be overridden in production via ADMIN_USERNAME / ADMIN_PASSWORD env vars
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}

# Thymeleaf
spring.thymeleaf.cache=false
