<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FFBLobby Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4">FFBLobby Admin Panel</h1>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Register Form -->
    <div class="card mb-4">
        <div class="card-header"><strong>Register New Backend</strong></div>
        <div class="card-body">
            <form th:action="@{/admin/backends}" method="post">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" name="name" required placeholder="my-backend">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Environment</label>
                        <select class="form-select" name="environment" required>
                            <option value="TEST">TEST</option>
                            <option value="LIVE">LIVE</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Version</label>
                        <input type="text" class="form-control" name="version" placeholder="1.0.0">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">JNLP URL</label>
                        <input type="text" class="form-control" name="jnlpUrl" placeholder="https://...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Check URL</label>
                        <input type="text" class="form-control" name="checkUrl" placeholder="https://...">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Backends Table -->
    <div class="card">
        <div class="card-header"><strong>Registered Backends</strong></div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Environment</th>
                        <th>Version</th>
                        <th>JNLP URL</th>
                        <th>Check URL</th>
                        <th>Primary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="backend : ${backends}">
                        <td th:text="${backend.name}"></td>
                        <td th:text="${backend.environment}"></td>
                        <td th:text="${backend.version}"></td>
                        <td>
                            <a th:if="${backend.jnlpUrl != null}" th:href="${backend.jnlpUrl}"
                               th:text="${backend.jnlpUrl}" class="text-truncate d-inline-block"
                               style="max-width:200px;" target="_blank"></a>
                        </td>
                        <td th:text="${backend.checkUrl}"></td>
                        <td>
                            <span th:if="${backend.primary}" class="badge bg-success">Primary</span>
                            <span th:unless="${backend.primary}" class="badge bg-secondary">No</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/backends/{name}/primary(name=${backend.name})}"
                                  method="post" class="d-inline"
                                  th:if="${!backend.primary}">
                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    Set Primary
                                </button>
                            </form>
                            <form th:action="@{/admin/backends/{name}/delete(name=${backend.name})}"
                                  method="post" class="d-inline"
                                  th:if="${!backend.primary}">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Deregister this backend?')">
                                    Deregister
                                </button>
                            </form>
                            <span th:if="${backend.primary}" class="text-muted small">
                                (Primary — cannot deregister)
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(backends)}">
                        <td colspan="7" class="text-center text-muted">No backends registered.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
